<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Search Engine - BM25 Toggle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .search-controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #dee2e6;
        }

        .method-selector {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .method-selector label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
            color: #333;
        }

        .method-selector input[type="radio"],
        .method-selector input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #007bff;
        }

        .compare-toggle {
            margin-left: auto;
            padding-left: 20px;
            border-left: 1px solid #dee2e6;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #007bff;
        }

        .search-button {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-button:hover:not(:disabled) {
            background: #0056b3;
        }

        .search-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error-message {
            padding: 12px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .comparison-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .comparison-container {
                grid-template-columns: 1fr;
            }

            .method-selector {
                flex-direction: column;
                align-items: flex-start;
            }

            .compare-toggle {
                margin-left: 0;
                padding-left: 0;
                border-left: none;
            }
        }

        .results-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #dee2e6;
        }

        .results-section.vsm {
            border-color: #007bff;
        }

        .results-section.bm25 {
            border-color: #28a745;
        }

        .method-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .results-section.vsm .method-header {
            border-bottom-color: #007bff;
        }

        .results-section.bm25 .method-header {
            border-bottom-color: #28a745;
        }

        .method-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .results-section.vsm .method-header h3 {
            color: #007bff;
        }

        .results-section.bm25 .method-header h3 {
            color: #28a745;
        }

        .result-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #666;
        }

        .results-section.vsm .result-badge {
            background: #e7f3ff;
            color: #004085;
        }

        .results-section.bm25 .result-badge {
            background: #d4edda;
            color: #155724;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-item {
            padding: 12px;
            background: #f8f9fa;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .results-section.bm25 .result-item {
            border-left-color: #28a745;
        }

        .result-item:hover {
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .result-rank {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .result-doc-id {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .result-score {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .result-score strong {
            color: #007bff;
            font-weight: 700;
        }

        .results-section.bm25 .result-score strong {
            color: #28a745;
        }

        .result-text {
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            word-break: break-word;
        }

        .single-results {
            background: white;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #ddd;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }

        .result-count {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧵 Clothing Search Engine</h1>
        <p class="subtitle">Compare VSM (lnc.ltc) vs BM25 Baseline</p>

        <div class="search-controls">
            <div class="method-selector">
                <label>
                    <input type="radio" name="method" value="vsm" checked id="method-vsm">
                    VSM (lnc.ltc)
                </label>
                
                <label>
                    <input type="radio" name="method" value="bm25" id="method-bm25">
                    BM25 Baseline
                </label>

                <label class="compare-toggle">
                    <input type="checkbox" id="compare-mode">
                    Compare Both Methods
                </label>
            </div>

            <div class="search-box">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search for clothing... (e.g., cotton shirt, denim jeans, winter jacket)"
                    onkeypress="if(event.key==='Enter') search()"
                >
                <button class="search-button" id="search-btn" onclick="search()">Search</button>
            </div>
        </div>

        <div id="error-container"></div>

        <div id="results-container"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        // Update method input states based on compare mode
        document.getElementById('compare-mode').addEventListener('change', function() {
            const radios = document.querySelectorAll('input[name="method"]');
            radios.forEach(radio => {
                radio.disabled = this.checked;
            });
        });

        async function search() {
            const query = document.getElementById('search-input').value.trim();
            const compareMode = document.getElementById('compare-mode').checked;
            const method = document.getElementById('method-vsm').checked ? 'vsm' : 'bm25';

            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = '';

            if (!query) {
                errorContainer.innerHTML = '<div class="error-message">Please enter a search query</div>';
                return;
            }

            const searchBtn = document.getElementById('search-btn');
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';

            try {
                let data;

                if (compareMode) {
                    const response = await fetch(`${API_BASE}/compare?q=${encodeURIComponent(query)}`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    data = await response.json();
                    displayComparisonResults(data);
                } else {
                    const response = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}&method=${method}`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    data = await response.json();
                    displaySingleResults(data);
                }
            } catch (error) {
                errorContainer.innerHTML = `<div class="error-message">Error: ${error.message}. Make sure the Flask backend is running on http://localhost:5000</div>`;
                console.error('Search error:', error);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
            }
        }

        function displaySingleResults(data) {
            const container = document.getElementById('results-container');
            const isVSM = data.method === 'VSM (lnc.ltc)';
            
            container.innerHTML = `
                <div class="single-results ${isVSM ? 'vsm' : 'bm25'}">
                    <h3>${data.method}</h3>
                    <p class="result-count">Found ${data.count} results for "${data.query}"</p>
                    <div class="results-list">
                        ${data.results.map((result, idx) => `
                            <div class="result-item">
                                <div class="result-rank">#${idx + 1}</div>
                                <div class="result-doc-id">${result.doc_id}</div>
                                <div class="result-score">Score: <strong>${result.score.toFixed(4)}</strong></div>
                                <div class="result-text">${result.text}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function displayComparisonResults(data) {
            const container = document.getElementById('results-container');
            
            container.innerHTML = `
                <div class="comparison-container">
                    <!-- VSM Results -->
                    <div class="results-section vsm">
                        <div class="method-header">
                            <h3>${data.vsm.method}</h3>
                            <span class="result-badge">${data.vsm.count} results</span>
                        </div>
                        <div class="results-list">
                            ${data.vsm.results.map((result, idx) => `
                                <div class="result-item">
                                    <div class="result-rank">#${idx + 1}</div>
                                    <div class="result-doc-id">${result.doc_id}</div>
                                    <div class="result-score">${result.score.toFixed(4)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- BM25 Results -->
                    <div class="results-section bm25">
                        <div class="method-header">
                            <h3>${data.bm25.method}</h3>
                            <span class="result-badge">${data.bm25.count} results</span>
                        </div>
                        <div class="results-list">
                            ${data.bm25.results.map((result, idx) => `
                                <div class="result-item">
                                    <div class="result-rank">#${idx + 1}</div>
                                    <div class="result-doc-id">${result.doc_id}</div>
                                    <div class="result-score">${result.score.toFixed(4)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Allow Enter key to trigger search
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') search();
        });
    </script>
</body>
</html>
